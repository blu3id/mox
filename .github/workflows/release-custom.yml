name: release-custom
on:
  push:
    branches:
      - "v*" # Will trigger if tag is pushed matching pattern `v*`

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Trigger rebuilding frontends, should be the same as committed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: 'touch */*.ts'

      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: make build
      - run: |
          docker build \
            --build-arg FAKEGIT_GO_SEMVER=${{ github.ref_name }}-$(git rev-parse --short HEAD) \
            --build-arg FAKEGIT_GO_REVISION=$(git rev-parse HEAD) \
            --build-arg FAKEGIT_GO_TIMESTAMP=$(git show -s --format=%ct HEAD) \
            -t ghcr.io/blu3id/mox:${{ github.ref_name }} \
            -t ghcr.io/blu3id/mox:${{ github.ref_name }}-$(git rev-parse --short HEAD) \
            .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push ghcr.io/blu3id/mox:${{ github.ref_name }}
      - run: docker push ghcr.io/blu3id/mox:${{ github.ref_name }}-$(git rev-parse --short HEAD)